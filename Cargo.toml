[workspace]
resolver = "2"
members = ["crates/rbacscope-core", "crates/rbacscope-report", "rbacscope-cli"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/Arifcse21/rbacscope"
keywords = ["kubernetes", "rbac", "security", "devsecops"]

[workspace.dependencies]
rbacscope-core = { path = "crates/rbacscope-core", version = "0.5.0" }
rbacscope-report = { path = "crates/rbacscope-report", version = "0.5.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
kube = "5.1"
k8s-openapi = { version = "0.29", features = ["latest"] }
tokio = { version = "1", features = ["rt", "net", "time", "signal", "io-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
