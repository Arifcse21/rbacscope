{{- if .Values.auditWebhook.enabled }}
{{- /*
  HTTPS for the audit receiver. Kubernetes clients (including the API server's audit
  webhook) only send bearer tokens over TLS. A private CA + server certificate for the
  Service DNS names is generated once and kept across upgrades. The webhook kubeconfig
  pins this CA and verifies the name with `tls-server-name`.
*/}}
{{- $name := printf "%s-audit-tls" (include "rbacscope.fullname" .) }}
{{- $svc := include "rbacscope.fullname" . }}
{{- $ns := .Release.Namespace }}
{{- $existing := lookup "v1" "Secret" $ns $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "rbacscope.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
  {{- if and $existing $existing.data }}
  ca.crt: {{ index $existing.data "ca.crt" }}
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
  {{- else }}
  {{- $ca := genCA (printf "%s-audit-ca" $svc) 3650 }}
  {{- $dns := list $svc (printf "%s.%s" $svc $ns) (printf "%s.%s.svc" $svc $ns) (printf "%s.%s.svc.cluster.local" $svc $ns) }}
  {{- $cert := genSignedCert (printf "%s.%s.svc" $svc $ns) nil $dns 3650 $ca }}
  ca.crt: {{ $ca.Cert | b64enc }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  {{- end }}
{{- end }}
