{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rbacscope.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rbacscope.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rbacscope.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - port: 9090
{{- end }}
