{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rbacscope.fullname" . }}-reader
  labels:
    {{- include "rbacscope.labels" . | nindent 4 }}
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["serviceaccounts"{{ if .Values.scan.includePods }}, "pods"{{ end }}]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "rbacscope.fullname" . }}-reader
  labels:
    {{- include "rbacscope.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "rbacscope.fullname" . }}-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "rbacscope.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
