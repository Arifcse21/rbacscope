apiVersion: v1
kind: Service
metadata:
  name: {{ include "rbacscope.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rbacscope.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "rbacscope.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    {{- if .Values.auditWebhook.enabled }}
    - name: audit
      port: {{ .Values.auditWebhook.port }}
      targetPort: audit
    {{- end }}
