# Test workload for rbacscope on a local cluster.
#   kubectl apply -f examples/k3s-test/rbacscopetest.yaml
#   kubectl delete namespace rbacscopetest          # cleanup
apiVersion: v1
kind: Namespace
metadata:
  name: rbacscopetest
---
# ---------- Good: least-privilege web app ----------
apiVersion: v1
kind: ServiceAccount
metadata: {name: web, namespace: rbacscopetest}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: web-config-reader, namespace: rbacscopetest}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["web-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: web-config-reader, namespace: rbacscopetest}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: web-config-reader}
subjects:
  - {kind: ServiceAccount, name: web, namespace: rbacscopetest}
---
apiVersion: v1
kind: Pod
metadata: {name: web, namespace: rbacscopetest, labels: {app: web}}
spec:
  serviceAccountName: web
  containers:
    - name: nginx
      image: nginx:alpine
      ports: [{containerPort: 80}]
---
# ---------- Bad: "debug" helper that reads secrets and execs into pods ----------
apiVersion: v1
kind: ServiceAccount
metadata: {name: debug-helper, namespace: rbacscopetest}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: debug-helper, namespace: rbacscopetest}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: debug-helper, namespace: rbacscopetest}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: debug-helper}
subjects:
  - {kind: ServiceAccount, name: debug-helper, namespace: rbacscopetest}
---
apiVersion: v1
kind: Pod
metadata: {name: debug-helper, namespace: rbacscopetest}
spec:
  serviceAccountName: debug-helper
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "infinity"]
---
# ---------- Bad: default ServiceAccount with wildcard on pods ----------
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: pod-admin, namespace: rbacscopetest}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: default-pod-admin, namespace: rbacscopetest}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: pod-admin}
subjects:
  - {kind: ServiceAccount, name: default, namespace: rbacscopetest}
---
apiVersion: v1
kind: Pod
metadata: {name: worker, namespace: rbacscopetest}
spec:
  # no serviceAccountName -> runs as "default" and inherits pod-admin
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "infinity"]
---
# ---------- Bad: binding to a Role that doesn't exist ----------
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: legacy-ops, namespace: rbacscopetest}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ops-role-deleted}
subjects:
  - {apiGroup: rbac.authorization.k8s.io, kind: User, name: legacy-ops-user}
